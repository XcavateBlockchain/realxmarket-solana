[package]
name = "marketplace"
version = "0.1.0"
description = "Property listings, fractional share sales, and legal settlement for the realXmarket protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "marketplace"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "regions/idl-build", "xcavate-whitelist/idl-build", "xcavate-common/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
xcavate-common = { path = "../../crates/common" }
xcavate-whitelist = { path = "../xcavate-whitelist", features = ["cpi"] }
regions = { path = "../regions", features = ["no-entrypoint"] }

[dev-dependencies]
property = { path = "../property" }
litesvm = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
solana-signer = { workspace = true }
solana-keypair = { workspace = true }
solana-account = { workspace = true }
proptest = { workspace = true }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
