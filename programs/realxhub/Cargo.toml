[package]
name = "realxhub"
version = "0.1.0"
description = "Hub proposals, verification, and escrowed token purchases"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "realxhub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "regions/idl-build", "xcavate-whitelist/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
xcavate-whitelist = { path = "../xcavate-whitelist", features = ["cpi"] }
regions = { path = "../regions", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = { workspace = true }
solana-message = { workspace = true }
solana-transaction = { workspace = true }
solana-signer = { workspace = true }
solana-keypair = { workspace = true }
solana-account = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
